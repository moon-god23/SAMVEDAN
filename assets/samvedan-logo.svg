<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 36" width="42" height="36">
  <defs>
    <linearGradient id="samCyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00a8e8"/>
      <stop offset="100%" stop-color="#00f2ff"/>
    </linearGradient>
    <linearGradient id="samWhiteLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="samWhiteRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="samGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00d2ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#samGlow)">
    <!-- Base Plate -->
    <line x1="7" y1="22.5" x2="34" y2="22.5" stroke="#040911" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Bottom Center Cyan Triangle -->
    <polygon points="8,21.5 33,21.5 20.5,13.5" fill="url(#samCyan)" stroke="#040911" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Left Wing (White) -->
    <polygon points="16.5,1.5 20,1.5 20,13.8 7.5,21.5" fill="url(#samWhiteLeft)" stroke="#040911" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- Right Wing (White) -->
    <polygon points="21,1.5 24.5,1.5 33.5,21.5 21,13.8" fill="url(#samWhiteRight)" stroke="#040911" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- Center Spine Divider -->
    <line x1="20.5" y1="1" x2="20.5" y2="13.8" stroke="#040911" stroke-width="1"/>
  </g>
</svg>
